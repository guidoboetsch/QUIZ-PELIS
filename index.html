<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d12" />
    <meta name="description" content="Quiz Pelis: encadená 10 respuestas correctas de tu película favorita." />
    <title>Quiz Pelis — ¿Cuánto sabés?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-action="go-home" aria-label="Volver al inicio">
          <span class="brand-mark">Q</span>
          <span>QUIZ<span class="brand-accent">PELIS</span></span>
        </button>
        <div class="topbar-actions">
          <span class="header-streak" title="Mejor racha">
            <span class="mini-flame">✦</span>
            <span id="header-best">0</span>
          </span>
          <button class="icon-button" data-action="open-help" aria-label="Cómo jugar">?</button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>

      <footer class="footer">
        <span>Hecho para maratonear</span>
        <span class="footer-dot">•</span>
        <span>10 aciertos. Cero margen.</span>
      </footer>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" data-action="close-modal" aria-label="Cerrar">×</button>
        <div id="modal-content"></div>
      </section>
    </div>

    <script src="movies.js"></script>
    <script src="app.js"></script>
  </body>
</html>
