<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a09" />
    <meta name="description" content="Quiz Pelis: encadenen 10 respuestas correctas de su película favorita." />
    <title>Quiz Pelis — ¿Cuánto saben?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-action="go-home" aria-label="Volver al inicio">
          <span class="brand-mark">Q</span>
          <span>QUIZ<span class="brand-accent">PELIS</span></span>
        </button>
      </header>

      <main id="app" tabindex="-1"></main>

      <footer class="footer">
        <span>10 aciertos. Cero margen.</span>
      </footer>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" data-action="close-modal" aria-label="Cerrar">×</button>
        <div id="modal-content"></div>
      </section>
    </div>

    <script src="movies.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
